<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Python Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header">
                        <h3 class="card-title mb-0">⚙️ Admin Panel</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <h5>Database Management</h5>
                            <button class="btn btn-success" onclick="addSampleData()">
                                📊 Add Sample Data
                            </button>
                            <div id="result" class="mt-3"></div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>Quick Actions</h5>
                            <a href="/" class="btn btn-primary me-2">📈 View Dashboard</a>
                            <a href="/health" class="btn btn-info">❤️ Health Check</a>
                        </div>
                        
                        <div class="mb-4">
                            <h5>System Information</h5>
                            <ul class="list-group">
                                <li class="list-group-item">🐍 Python Flask Application</li>
                                <li class="list-group-item">🗄️ PostgreSQL Database</li>
                                <li class="list-group-item">☁️ Google Cloud Platform VM</li>
                                <li class="list-group-item">📊 Plotly Charts</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function addSampleData() {
            const button = event.target;
            const resultDiv = document.getElementById('result');
            
            button.disabled = true;
            button.textContent = 'Adding data...';
            resultDiv.innerHTML = '<div class="alert alert-info">Adding sample data...</div>';
            
            try {
                const response = await fetch('/api/add_sample_data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
                } else {
                    resultDiv.innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            } finally {
                button.disabled = false;
                button.textContent = '📊 Add Sample Data';
            }
        }
    </script>
</body>
</html>
