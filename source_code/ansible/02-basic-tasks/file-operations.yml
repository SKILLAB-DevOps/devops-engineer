---
# File and Directory Operations - Ansible Teaching Example
# Learn the essential file module - one of the most used Ansible modules!
# This playbook demonstrates creating, modifying, and managing files safely

- name: "File and Directory Operations Tutorial"
  hosts: all
  become: true
  gather_facts: true  # We need date/time facts
  
  vars:
    # Best practice: Use variables for paths that might change
    demo_path: "/tmp/ansible-file-demo"
    demo_user: "{{ ansible_user | default('root') }}"
    
  tasks:
    - name: "Learning Objective"
      ansible.builtin.debug:
        msg: |
          
          What you'll learn in this playbook:
          - Create directories with proper permissions
          - Create and modify files safely
          - Use loops to create multiple items
          - Check file status and properties
          - Create symbolic links
          - Understand Ansible idempotency
          
    # Step 1: Directory Creation
    - name: "Create main demo directory"
      ansible.builtin.file:
        path: "{{ demo_path }}"
        state: directory
        mode: '0755'  # rwxr-xr-x (owner: read/write/execute, group/others: read/execute)
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
      tags: 
        - directory_creation
        
    # Step 2: File Creation (Method 1 - touch)
    - name: "Create empty file using touch"
      ansible.builtin.file:
        path: "{{ demo_path }}/empty-file.txt"
        state: touch  # Creates file if it doesn't exist, updates timestamp if it does
        mode: '0644'  # rw-r--r-- (owner: read/write, group/others: read-only)
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
      tags:
        - file_creation
        
    # Step 3: File Creation (Method 2 - with content)
    - name: "Create file with content using copy module"
      ansible.builtin.copy:
        content: |
          # Ansible File Demo
          
          This file was created by Ansible on {{ ansible_date_time.date }} at {{ ansible_date_time.time }}
          
          Server Information:
          - Hostname: {{ ansible_hostname }}
          - Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}
          - Architecture: {{ ansible_architecture }}
          - Current User: {{ demo_user }}
          
          This demonstrates how Ansible can create files with dynamic content!
        dest: "{{ demo_path }}/server-info.txt"
        mode: '0644'
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
        backup: yes  # Creates backup if file already exists
      tags:
        - file_creation
        
    # Step 4: Multiple Directory Creation with Loop
    - name: "Create multiple subdirectories using loops"
      ansible.builtin.file:
        path: "{{ demo_path }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
      loop:
        - logs
        - config
        - data
        - backups
        - temp
      tags:
        - directory_creation
        
    # Step 5: File Status Checking
    - name: "Check file status and properties"
      ansible.builtin.stat:
        path: "{{ demo_path }}/server-info.txt"
      register: file_status
      tags:
        - file_inspection
        
    - name: "Display file information"
      ansible.builtin.debug:
        msg: |
          
          File Status Report:
          File exists: {{ file_status.stat.exists }}
          File size: {{ file_status.stat.size | default(0) }} bytes
          Permissions: {{ file_status.stat.mode | default('unknown') }}
          Owner: {{ file_status.stat.pw_name | default('unknown') }}
          Group: {{ file_status.stat.gr_name | default('unknown') }}
          Last modified: {{ file_status.stat.mtime | default(0) | int | to_datetime }}
      when: file_status.stat.exists
      tags:
        - file_inspection
        
    # Step 6: Symbolic Link Creation
    - name: "Create symbolic link (shortcut)"
      ansible.builtin.file:
        src: "{{ demo_path }}/server-info.txt"
        dest: "{{ demo_path }}/server-info-link.txt"
        state: link
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
      tags:
        - symbolic_links
        
    # Step 7: Configuration File Example
    - name: "Create a configuration file example"
      ansible.builtin.copy:
        content: |
          # Sample Application Configuration
          # Generated by Ansible
          
          [general]
          app_name = "ansible-demo-app"
          version = "1.0.0"
          debug = true
          
          [server]
          hostname = "{{ ansible_hostname }}"
          port = 8080
          
          [database]
          host = "localhost"
          port = 3306
          name = "demo_db"
          
          # File created: {{ ansible_date_time.iso8601 }}
        dest: "{{ demo_path }}/config/app.conf"
        mode: '0600'  # Only owner can read/write (secure config file)
        owner: "{{ demo_user }}"
        group: "{{ demo_user }}"
        backup: yes
      tags:
        - config_files
        
    # Step 8: Verification
    - name: "List all created files and directories"
      ansible.builtin.command:
        cmd: "find {{ demo_path }} -type f -o -type d -o -type l"
      register: created_files
      changed_when: false  # This command doesn't change anything
      tags:
        - verification
        
    - name: "Show what we created"
      ansible.builtin.debug:
        msg: |
          
          File Operations Complete!
          
          Created directory structure:
          {{ created_files.stdout_lines | join('\n') }}
          
          Key Learning Points:
          - Files are created idempotently (running again won't create duplicates)
          - Always set appropriate permissions (mode)
          - Use variables for paths and users
          - backup=yes creates safety backups
          - stat module lets you inspect file properties
          
          Try running this playbook again - notice nothing changes!
      tags:
        - verification