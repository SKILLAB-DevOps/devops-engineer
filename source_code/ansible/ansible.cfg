# Ansible Configuration for Teaching Examples
# This file contains best practice settings for learning environments

[defaults]
# Inventory file location
inventory = inventory

# Improve output for learning
stdout_callback = yaml
callback_whitelist = timer, profile_tasks

# Security and connection settings
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = memory

# Logging for debugging (useful for learning)
log_path = ./ansible.log

# Role and collection paths
roles_path = ./roles
collections_paths = ./collections

# SSH settings for teaching environments
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[inventory]
# Enable built-in plugins
enable_plugins = host_list, script, auto, yaml, ini, toml