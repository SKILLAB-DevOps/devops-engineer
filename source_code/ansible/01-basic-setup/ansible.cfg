[defaults]
# Use YAML inventory format
inventory = inventory.yml

# Disable host key checking for learning environment
host_key_checking = False

# Set default user
remote_user = ubuntu

# Enable SSH multiplexing for better performance
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Callback plugins for better output
stdout_callback = yaml
callback_whitelist = timer, profile_tasks

# Retry file location
retry_files_enabled = True
retry_files_save_path = ./retry

# Logging
log_path = ./ansible.log

[privilege_escalation]
# Default become method
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH timeout
timeout = 10

# SSH connection retries
retries = 3