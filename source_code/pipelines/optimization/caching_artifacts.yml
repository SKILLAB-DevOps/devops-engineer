name: Advanced Caching & Artifacts
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Layer 1: Package manager cache
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      
      # Layer 2: Pre-commit environment cache
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      
      # Layer 3: Build artifacts cache
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            build/
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-
      
      - name: Build application
        run: |
          echo "Building application..."
          mkdir -p dist
          echo "Built app" > dist/app.txt
          # Create different artifacts for different purposes
          tar -czf app-source.tar.gz src/
          tar -czf app-dist.tar.gz dist/
      
      - name: Upload source for debugging
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: app-source.tar.gz
          retention-days: 7  # Keep for a week
      
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: app-dist.tar.gz
          retention-days: 90  # Keep longer for releases

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: distribution
      
      - name: Test distribution
        run: |
          tar -xzf app-dist.tar.gz
          # Test the built distribution
          echo "Testing distribution..."
