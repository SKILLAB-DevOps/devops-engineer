name: Secret Rotation
on:
  schedule:
    - cron: '0 2 1 * *'  # Monthly at 2 AM
  workflow_dispatch:  # Manual trigger

jobs:
  rotate-api-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Generate new API key
        id: new-key
        run: |
          # Generate new key from your service
          NEW_KEY=$(curl -X POST -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            https://api.service.com/keys/generate | jq -r '.key')
          echo "::add-mask::$NEW_KEY"  # Mask in logs
          echo "key=$NEW_KEY" >> $GITHUB_OUTPUT
      
      - name: Update GitHub secret
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECRET_ROTATION_TOKEN }}
          script: |
            const sodium = require('tweetsodium');
            const key = "${{ steps.new-key.outputs.key }}";
            
            // Encrypt and update the secret
            const publicKey = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const encrypted = sodium.seal(
              Buffer.from(key),
              Buffer.from(publicKey.data.key, 'base64')
            );
            
            await github.rest.actions.createOrUpdateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'API_KEY',
              encrypted_value: Buffer.from(encrypted).toString('base64'),
              key_id: publicKey.data.key_id,
            });
