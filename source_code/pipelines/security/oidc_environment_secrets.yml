name: Advanced Security
on: [push, pull_request]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsRole
          aws-region: us-east-1
          # No access keys needed!
      
      - name: Deploy to environment
        id: deploy
        run: |
          # Secrets are automatically scoped to the environment
          echo "Deploying with DATABASE_URL: ${{ secrets.DATABASE_URL }}"
          echo "API_KEY configured: ${{ secrets.API_KEY != '' }}"
          
          # Environment-specific logic
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            DEPLOY_URL="https://myapp.com"
          else
            DEPLOY_URL="https://staging.myapp.com"
          fi
          
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      
      - name: Deploy to AWS
        run: |
          aws s3 sync ./dist s3://my-app-bucket
          aws cloudfront create-invalidation --distribution-id E1234567890123 --paths "/*"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
