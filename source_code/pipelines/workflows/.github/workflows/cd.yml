name: Production Deployment

on:
  push:
    tags: [ 'v*' ]                            # Trigger on version tags (e.g., v1.0.0)

jobs:
  # Run full CI first
  test:
    uses: ./.github/workflows/ci.yml          # Reuse CI workflow
  
  # Build and package the application
  build:
    needs: test                               # Only build if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Build package
        run: uv build                         # Create wheel and source distribution
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4      # Store artifacts for deployment
        with:
          name: python-package
          path: dist/
  
  # Deploy to staging environment
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging                      # Requires staging environment setup
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Example deployment commands:
          # pip install dist/*.whl
          # systemctl restart myapp
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # curl -f http://staging.myapp.com/health
  
  # Deploy to production (only on version tags)
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production                   # Requires production environment setup
    if: startsWith(github.ref, 'refs/tags/v') # Only deploy tags
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ github.ref_name }} to production..."
          # Production deployment commands here
      
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1  # Create GitHub release
        with:
          files: dist/*
          generate_release_notes: true        # Auto-generate release notes